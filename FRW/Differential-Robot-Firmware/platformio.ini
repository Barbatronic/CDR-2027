; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html
;
; Environnements :
;   esp32-s3-devkitc-1  développement (par défaut) : WiFi STA, tir immédiat
;   match               match : WiFi en point d'accès, tir à la phase d'attaque
;   match_nowifi        match sans WiFi (zéro overhead) — à compiler
;                       régulièrement : pio run -e match_nowifi

[platformio]
default_envs = esp32-s3-devkitc-1

[env]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

board_build.filesystem = littlefs

extra_scripts = pre:scripts/sync_poi.py

build_flags =
    -DCORE_DEBUG_LEVEL=1

lib_deps =
    gin66/FastAccelStepper @ ^0.31.0
    olikraus/U8g2 @ ^2.35.19
    adafruit/Adafruit NeoPixel @ ^1.12.0
    links2004/WebSockets @ ^2.4.1

[env:esp32-s3-devkitc-1]

[env:match]
build_flags =
    ${env.build_flags}
    -DWIFI_USE_STA=0
    -DTIR_ATTENDRE_PHASE_ATTAQUE=1

[env:match_nowifi]
build_flags =
    ${env.build_flags}
    -DWIFI_LOG_ENABLED=0
    -DTIR_ATTENDRE_PHASE_ATTAQUE=1
